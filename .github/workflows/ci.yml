name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run build

  rust-checks:
    name: Rust Checks
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  build-tauri:
    name: Build Tauri
    runs-on: windows-latest
    needs: rust-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build --bundles msi,nsis
        working-directory: src-tauri

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metisschedule-builds
          path: src-tauri/target/release/bundle/**
          retention-days: 7

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: metisschedule-exe
          path: src-tauri/target/release/MetisSchedule.exe
          retention-days: 7
